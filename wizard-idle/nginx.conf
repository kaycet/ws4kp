server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/javascript mjs;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'" always;

    # Modules and styles change between deploys without hashed names, so
    # revalidate them; the HTML entry point is never cached.
    location ~* \.(mjs|css)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
